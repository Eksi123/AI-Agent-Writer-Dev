[LLM]
api_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model_name = qwen-plus
provider = openai_compatible
temperature = 0.7
top_p = 0.9

[Ollama]
api_url = http://localhost:11434/v1
model_name = qwen2.5
temperature = 0.7
top_p = 0.9
enabled = false

[Web Server]
port = 8000
auto_open_browser = true

[Robustness]
# LLM 单次请求超时（秒）
request_timeout = 120
# 整个写作工作流超时（秒）
workflow_timeout = 600
# LLM API 调用失败后的最大重试次数
max_retries = 3
# 重试基础延迟（秒），指数退避
retry_base_delay = 1
# 主模型连续失败多少次后自动降级到 Ollama
fallback_threshold = 3